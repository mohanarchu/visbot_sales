<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visbot Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/css/admin.css">
<link rel="stylesheet" href="/ui/css/app.css">
</head>
<body>

<div id="root">
  <!-- The shell is painted immediately; each view fills in when its API call returns. -->
  <div class="boot">
    <div class="boot-mark"><img src="/assets/logo-mark.png" alt=""></div>
    <div class="spinner"></div>
  </div>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>

<script type="module" src="/ui/js/main.js"></script>
<noscript>
  <p style="padding:2rem;font:15px/1.5 system-ui;">
    This panel needs JavaScript. The server-rendered version is still available at
    <a href="/admin">/admin</a>.
  </p>
</noscript>
</body>
</html>
