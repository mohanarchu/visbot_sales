# Visbot Industries — visbot.in / admin.visbot.in / backend.visbot.in
#
# This file belongs to the visbot.in site only. Other sites on this server have
# their own files in /etc/nginx/sites-available/ — do not edit those.
#
# Install:  /etc/nginx/sites-available/visbot.in.conf
#   ln -s /etc/nginx/sites-available/visbot.in.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# TLS: run `certbot --nginx -d visbot.in -d www.visbot.in -d admin.visbot.in -d backend.visbot.in`
# afterwards — certbot rewrites these blocks to add the certificates and the
# HTTP-to-HTTPS redirects.

# ---------------------------------------------------------------- website :9000
server {
    listen 80;
    listen [::]:80;
    server_name visbot.in www.visbot.in;

    access_log /var/log/nginx/visbot.in.access.log;
    error_log  /var/log/nginx/visbot.in.error.log;

    # Product photos and other media straight from disk, bypassing Node.
    location /assets/ {
        alias /var/www/visbot/assets/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Stylesheets and scripts also come from disk, cached for a week. Express
    # would otherwise send Cache-Control: max-age=0 and force a revalidation
    # round trip on every page view.
    location ~* ^/(css|js)/ {
        root /var/www/visbot;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # The enquiry form and any other API call go to the backend service.
    location /api/ {
        proxy_pass http://127.0.0.1:9001;
        include /etc/nginx/snippets/visbot-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:9000;
        include /etc/nginx/snippets/visbot-proxy.conf;
    }
}

# ------------------------------------------------------------------ admin :9002
server {
    listen 80;
    listen [::]:80;
    server_name admin.visbot.in;

    access_log /var/log/nginx/admin.visbot.in.access.log;
    error_log  /var/log/nginx/admin.visbot.in.error.log;

    # Product and spare photos uploaded from the admin panel.
    client_max_body_size 10m;

    # Keep the admin panel out of search results.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /assets/ {
        alias /var/www/visbot/assets/;
        access_log off;
        expires 7d;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:9002;
        include /etc/nginx/snippets/visbot-proxy.conf;
    }
}

# ---------------------------------------------------------------- backend :9001
server {
    listen 80;
    listen [::]:80;
    server_name backend.visbot.in;

    access_log /var/log/nginx/backend.visbot.in.access.log;
    error_log  /var/log/nginx/backend.visbot.in.error.log;

    # Meta webhook payloads are small; keep the limit tight.
    client_max_body_size 2m;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:9001;
        include /etc/nginx/snippets/visbot-proxy.conf;
    }
}
